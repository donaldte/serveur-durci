# À FAIRE (P1-07) : efface cette ligne quand le fichier est écrit.
# Ton site du TP 5, décrit dans le dépôt. Pars du fichier de ton TP 5 :
#     sudo cat /etc/nginx/sites-available/mboa        (ou le nom que tu lui as donné)
# Remplace ton nom (prénom.formationdevops.xyz) par @FQDN@ partout : le module remet le bon.
# Les lignes « # managed by Certbot » : garde ssl_certificate et ssl_certificate_key, enlève les
# lignes include et ssl_dhparam de certbot.
# Il faut :
#   - un bloc pour le port 80 (listen 80; et listen [::]:80;) qui sert /.well-known/acme-challenge/
#     depuis /var/www/letsencrypt (pour que certbot renouvelle le certificat), et renvoie tout le
#     reste vers HTTPS : return 301 https://$host$request_uri; dans un « location / » ;
#   - un bloc pour le port 443 (listen 443 ssl; et listen [::]:443 ssl;) avec le certificat
#     /etc/letsencrypt/live/@FQDN@/fullchain.pem et sa clé privkey.pem, qui passe tout à la
#     boutique : proxy_pass http://127.0.0.1:8080; et les quatre proxy_set_header du TP 5 ;
#   - le durcissement : server_tokens off; dans chaque bloc, et dans le bloc 443 au moins
#     add_header X-Content-Type-Options "nosniff" always;
# Teste-le sans toucher au serveur : sudo ./tests/configurations.sh
