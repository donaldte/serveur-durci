# Posé par serveur-durci (modules/50-site.sh) dans /etc/nginx/sites-available/serveur-durci.
# @FQDN@ est remplacé par le nom de ton serveur (prénom.formationdevops.xyz).
# Ne le modifie pas sur le serveur : modifie le dépôt, pousse, puis sudo serveur-durci-deployer.

# HTTP : les défis de Let's Encrypt (pour renouveler le certificat), et tout le reste vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name @FQDN@;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS : la boutique (TP 5), derrière nginx.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @FQDN@;

    ssl_certificate     /etc/letsencrypt/live/@FQDN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@FQDN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:serveur_durci:10m;
    ssl_session_timeout 1d;

    # Le durcissement : la version de nginx n'est pas affichée, et les en-têtes de sécurité.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
