# Posé par serveur-durci (modules/50-site.sh) le temps d'obtenir le premier certificat :
# le site en HTTP seulement, pour que Let's Encrypt vérifie que le nom est à toi.
server {
    listen 80;
    listen [::]:80;
    server_name @FQDN@;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 404;
    }
}
