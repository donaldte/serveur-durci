# Posé par serveur-durci (modules/10-ssh.sh) dans /etc/ssh/sshd_config.d/.
# Pour sshd, la première valeur lue gagne : ce fichier (10-…) passe avant 50-cloud-init.conf.
# Ne le modifie pas sur le serveur : modifie le dépôt, pousse, puis sudo serveur-durci-deployer.

# On entre par clé, jamais par mot de passe.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Root jamais par mot de passe. « no » fermerait l'administration de certaines machines du
# labo, qui passe par root avec une clé : voir docs/decisions.md.
PermitRootLogin prohibit-password

# Un robot a 30 secondes pour s'authentifier, pas 2 minutes.
LoginGraceTime 30

# Rien d'inutile : pas d'affichage graphique à distance.
X11Forwarding no
