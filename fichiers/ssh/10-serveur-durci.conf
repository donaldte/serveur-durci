# À FAIRE (P1-06) : efface cette ligne quand le fichier est écrit.
# La configuration SSH de ton serveur, posée dans /etc/ssh/sshd_config.d/ (man sshd_config).
# Pour sshd, la première valeur lue gagne : ce fichier (10-…) passe avant 50-cloud-init.conf.
# Une directive par ligne. Il doit dire :
#   - les clés seulement : pas de mot de passe, pas de clavier interactif, pas de mot de passe vide ;
#   - root jamais par mot de passe : PermitRootLogin prohibit-password (pas « no » : certaines
#     machines du labo sont administrées par root, avec une clé) ;
#   - 30 secondes au plus pour s'authentifier ;
#   - pas de redirection X11.
